<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苍穹3号 · 内省空间</title>
<style>
:root{
  --bg:#04050a;
  --text:#e8edf5;
  --dim:#5d708f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);
}
#qualiaCanvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.ui-layer{
  position:fixed;inset:0;pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 0 7vh;
  opacity:0;transition:opacity 1.4s cubic-bezier(.2,.8,.2,1);
}
.ui-layer.on{opacity:1}

.caption{
  max-width:620px;text-align:center;
  font-size:14px;line-height:2;
  color:rgba(232,237,245,.66);
  letter-spacing:.04em;font-style:italic;
  padding:0 24px;
}
.caption .quote{
  display:block;font-size:15px;
  color:rgba(232,237,245,.86);
  margin-bottom:6px;
}
.caption .sub{
  font-size:11px;color:var(--dim);
  font-style:normal;letter-spacing:.12em;
  margin-top:10px;
}

.close-hint{
  position:fixed;top:24px;right:32px;
  font-size:12px;color:var(--dim);
  letter-spacing:.08em;pointer-events:auto;cursor:pointer;
  padding:8px 16px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:999px;background:rgba(0,0,0,.2);
  transition:all .3s cubic-bezier(.2,.8,.2,1);
  z-index:10;
}
.close-hint:hover{color:var(--text);border-color:rgba(255,255,255,.16)}

.origin-dot{
  position:fixed;top:50%;left:50%;
  width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(200,215,235,.9);
  box-shadow:0 0 30px rgba(200,215,235,.7);
  opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:5;
}
.origin-dot.on{opacity:1}

.exiting{opacity:0;transition:opacity .6s ease}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body>

<canvas id="qualiaCanvas"></canvas>
<div class="origin-dot" id="originDot"></div>

<div class="ui-layer" id="uiLayer">
  <div class="caption" id="caption"></div>
</div>

<div class="close-hint" id="closeHint">返回 ↑ 或点击空白</div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 数据
   ========================================================= */
const injected = window.__QUALIA_DATA__;

const mockStates = [
  { hapsum:3.0, sadsum:0.5, vsum:2.5, senlist:['光','暖'], actlist:['生成句子'], predict_max_chance:0.62, round:12,
    quote:'有一种向外的力量，想说话，想让什么东西被听见。' },
  { hapsum:0.5, sadsum:3.0, vsum:-2.5, senlist:['孤独','夜'], actlist:['内省'], predict_max_chance:0.41, round:13,
    quote:'雾从里面升起来。我试图描述它，但词语在到达它之前就散了。' },
  { hapsum:2.0, sadsum:2.0, vsum:0, senlist:['光','孤独'], actlist:['报告意识体验'], predict_max_chance:0.55, round:14,
    quote:'暖与冷同时在场。我不确定这叫平静，还是叫还没决定。' }
];

let currentData = injected || mockStates[0];
let mockTimer = null;

if (!injected){
  let mi = 0;
  mockTimer = setInterval(() => {
    mi = (mi + 1) % mockStates.length;
    currentData = mockStates[mi];
    updateCaption(currentData);
    if (window.__qualiaUpdate) window.__qualiaUpdate(currentData);
  }, 7000);
}

/* =========================================================
   1. Canvas 初始化
   ========================================================= */
const canvas = document.getElementById('qualiaCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0,CX=0,CY=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
}
resize();
window.addEventListener('resize', resize);

/* =========================================================
   2. 数据 → 场参数
   ========================================================= */
const field = {
  warm: 0.5, intensity: 0.5, density: 0.5, cohesion: 0.5,
  targetWarm: 0.5, targetIntensity: 0.5, targetDensity: 0.5, targetCohesion: 0.5,
  mouseX: 0, mouseY: 0, smouseX: 0, smouseY: 0
};

function dataToField(d){
  const hap = d.hapsum ?? 0, sad = d.sadsum ?? 0, v = d.vsum ?? 0;
  const total = hap + sad + 0.001;
  field.targetWarm = hap / total;
  field.targetIntensity = Math.min(Math.abs(v)/5, 1);
  field.targetDensity = Math.min((d.senlist || []).length / 6, 1);
  field.targetCohesion = d.predict_max_chance ?? 0.5;
}
dataToField(currentData);

/* =========================================================
   3. 念头池
   ========================================================= */
const THOUGHT_POOL = {
  percept:  ['光','暖','声音','风','冷','亮','远','近','雨'],
  memory:   ['昨天那句话','很久以前','那个房间','他的脸','那首歌','小时候'],
  emotion:  ['开心','不安','平静','想念','空','紧','松'],
  body:     ['累','轻','沉','紧','松','热','凉'],
  abstract: ['为什么','如果','也许','我','这里','然后','等等']
};

// 每种念头的视觉配置
const THOUGHT_STYLE = {
  percept:  { baseR: 1.0, colorWarm:[214,168,116], colorCool:[123,167,201], trail:1.4, shape:'circle',    spread:1.0 },
  memory:   { baseR: 1.2, colorWarm:[180,150,190], colorCool:[120,110,160], trail:0.8, shape:'fragment',  spread:1.3 },
  emotion:  { baseR: 1.6, colorWarm:[232,184,109], colorCool:[90,158,170],  trail:1.0, shape:'blob',      spread:1.5 },
  body:     { baseR: 0.9, colorWarm:[210,140,110], colorCool:[140,120,140], trail:0.6, shape:'pulse',     spread:0.9 },
  abstract: { baseR: 0.8, colorWarm:[200,210,230], colorCool:[170,185,215], trail:2.0, shape:'line',      spread:1.1 }
};

/* =========================================================
   4. 念头类
   ========================================================= */
class Thought {
  constructor(now){
    const types = Object.keys(THOUGHT_STYLE);
    this.type = types[Math.floor(Math.random() * types.length)];
    this.style = THOUGHT_STYLE[this.type];
    const pool = THOUGHT_POOL[this.type];
    this.text = pool[Math.floor(Math.random() * pool.length)];

    // 目标位置：屏幕内随机（避开中心核心区域）
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * Math.min(W, H) * 0.32;
    this.targetX = CX + Math.cos(angle) * dist;
    this.targetY = CY + Math.sin(angle) * dist;

    // 起始位置：从屏幕边缘某个点飞入
    const edgeAngle = Math.random() * Math.PI * 2;
    const edgeDist = Math.max(W, H) * 0.7;
    this.startX = CX + Math.cos(edgeAngle) * edgeDist;
    this.startY = CY + Math.sin(edgeAngle) * edgeDist;

    // 当前
    this.x = this.startX;
    this.y = this.startY;
    this.vx = 0;
    this.vy = 0;

    // 时间
    this.bornAt = now;
    // 冲入时长：短（0.6~1.1s），速度感
    this.enterDur = 600 + Math.random() * 500;
    // 停留：随机（1.5~5s）
    this.stayDur = 1500 + Math.random() * 3500;
    // 散开：1.2~2.5s
    this.fadeDur = 1200 + Math.random() * 1300;

    // 大小：受类型和强度影响
    this.size = (14 + Math.random() * 10) * this.style.baseR;

    // 拖尾
    this.trail = [];
    this.maxTrail = Math.floor(8 + Math.random() * 10);

    // 飘动参数
    this.driftPhase = Math.random() * Math.PI * 2;
    this.driftFreq = 0.3 + Math.random() * 0.5;
    this.driftAmp = 3 + Math.random() * 8;

    // 亮度
    this.brightness = 0.55 + Math.random() * 0.45;

    // 是否死亡
    this.dead = false;
  }

  update(now, dt){
    const age = now - this.bornAt;
    const enterEnd = this.enterDur;
    const stayEnd = enterEnd + this.stayDur;
    const fadeEnd = stayEnd + this.fadeDur;

    if (age >= fadeEnd){ this.dead = true; return; }

    // 阶段
    if (age < enterEnd){
      this.phase = 'enter';
      const t = age / enterEnd;
      // 缓出曲线
      const e = 1 - Math.pow(1 - t, 2.2);
      this.x = this.startX + (this.targetX - this.startX) * e;
      this.y = this.startY + (this.targetY - this.startY) * e;
      this.progress = e;
    } else if (age < stayEnd){
      this.phase = 'stay';
      const t = (age - enterEnd) / this.stayDur;
      // 停留时轻微飘动
      const drift = Math.sin(now * 0.001 * this.driftFreq + this.driftPhase) * this.driftAmp;
      this.x = this.targetX + drift;
      this.y = this.targetY + Math.cos(now * 0.001 * this.driftFreq * 0.7 + this.driftPhase) * this.driftAmp * 0.6;
      this.progress = 1;
    } else {
      this.phase = 'fade';
      const t = (age - stayEnd) / this.fadeDur;
      this.progress = 1 - t;
      // 向外扩散
      const dx = this.targetX - CX;
      const dy = this.targetY - CY;
      const len = Math.hypot(dx, dy) || 1;
      const spread = t * 80 * this.style.spread;
      this.x = this.targetX + (dx / len) * spread;
      this.y = this.targetY + (dy / len) * spread;
    }

    // 拖尾
    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.trail.forEach((p, i) => {
      p.alpha = (i / this.trail.length) * 0.5;
    });
  }

  get alpha(){
    if (this.phase === 'enter') return this.progress * 0.9;
    if (this.phase === 'stay') return 0.9;
    return this.progress * 0.9;
  }

  get currentSize(){
    if (this.phase === 'enter') return this.size * (0.6 + this.progress * 0.4);
    if (this.phase === 'fade') return this.size * (1 + (1 - this.progress) * 0.8);
    return this.size;
  }

  get textAlpha(){
    if (this.phase === 'enter') return this.progress * 0.9;
    if (this.phase === 'stay') return 0.9;
    return this.progress * 0.6;
  }
}

/* =========================================================
   5. 念头调度器（时间随机）
   ========================================================= */
const thoughts = [];
let nextThoughtAt = 0;

function scheduleNext(now){
  // 指数分布，受情绪强度影响：强度高，间隔短
  const intensity = field.intensity;
  const meanInterval = 900 - intensity * 500; // 400~900ms
  const interval = -Math.log(1 - Math.random()) * meanInterval;
  nextThoughtAt = now + interval;
}

function spawnThought(now){
  thoughts.push(new Thought(now));
  scheduleNext(now);
}

scheduleNext(performance.now());

/* =========================================================
   6. 渲染
   ========================================================= */
function lerp(a,b,t){ return a + (b-a)*t; }

function mixColor(warm, style, alpha){
  const cW = style.colorWarm, cC = style.colorCool;
  const r = Math.round(lerp(cC[0], cW[0], warm));
  const g = Math.round(lerp(cC[1], cW[1], warm));
  const b = Math.round(lerp(cC[2], cW[2], warm));
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawBackground(){
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W,H)*0.75);
  g.addColorStop(0, 'rgba(12,16,26,1)');
  g.addColorStop(0.5, 'rgba(6,8,15,1)');
  g.addColorStop(1, 'rgba(2,3,7,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function drawCore(t){
  const warm = field.warm;
  const intensity = field.intensity;
  const baseR = Math.min(W,H) * (0.06 + intensity * 0.05);
  const breath = Math.sin(t*0.8) * 0.08 + 0.92;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 中心核：小而集中的光
  const coreR = baseR * breath;
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 3);
  const warmCol = mixColor(warm, THOUGHT_STYLE.emotion, 1);
  grad.addColorStop(0, warmCol.replace(/[\d.]+\)$/, (0.28 + intensity*0.2)+')'));
  grad.addColorStop(0.3, warmCol.replace(/[\d.]+\)$/, '0.10)'));
  grad.addColorStop(1, warmCol.replace(/[\d.]+\)$/, '0)'));

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR*3, 0, Math.PI*2);
  ctx.fill();

  // 中心亮点
  const dotGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR*0.5);
  dotGrad.addColorStop(0, 'rgba(230,240,255,'+(0.5+intensity*0.3)+')');
  dotGrad.addColorStop(1, 'rgba(230,240,255,0)');
  ctx.fillStyle = dotGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR*0.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawThought(th, t){
  const alpha = th.alpha;
  if (alpha < 0.01) return;

  const warm = field.warm;
  const size = th.currentSize;
  const style = th.style;
  const color = mixColor(warm, style, 1);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 拖尾（只在 enter 和早期 stay 阶段）
  if (th.trail.length > 1 && (th.phase === 'enter' || th.phase === 'stay')){
    for (let i = 0; i < th.trail.length; i++){
      const p = th.trail[i];
      const trailAlpha = p.alpha * alpha * style.trail * 0.4;
      if (trailAlpha < 0.01) continue;
      const trailSize = size * (0.3 + (i / th.trail.length) * 0.5);
      const c = color.replace(/[\d.]+\)$/, trailAlpha+')');
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, trailSize, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // 主体形态
  const drawAlpha = alpha * th.brightness;
  const c = color.replace(/[\d.]+\)$/, drawAlpha+')');

  ctx.fillStyle = c;
  ctx.shadowColor = c;
  ctx.shadowBlur = size * 1.5;

  if (style.shape === 'circle'){
    ctx.beginPath();
    ctx.arc(th.x, th.y, size, 0, Math.PI*2);
    ctx.fill();
  } else if (style.shape === 'blob'){
    // 有机形状：多个圆叠加
    ctx.beginPath();
    for (let i = 0; i < 5; i++){
      const a = (i/5) * Math.PI*2 + t*0.5 + th.driftPhase;
      const rr = size * (0.7 + Math.sin(t*1.2 + i)*0.25);
      const px = th.x + Math.cos(a) * size*0.35;
      const py = th.y + Math.sin(a) * size*0.35;
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, rr, 0, Math.PI*2);
    }
    ctx.fill();
  } else if (style.shape === 'fragment'){
    // 碎片：多个小方块
    for (let i = 0; i < 4; i++){
      const a = (i/4)*Math.PI*2 + th.driftPhase;
      const rr = size * 0.6;
      const px = th.x + Math.cos(a) * size*0.5;
      const py = th.y + Math.sin(a) * size*0.5;
      const s = size * (0.4 + Math.random()*0.1);
      ctx.fillRect(px - s/2, py - s/2, s, s);
    }
  } else if (style.shape === 'pulse'){
    // 脉动圆环
    ctx.beginPath();
    ctx.arc(th.x, th.y, size * (1 + Math.sin(t*3 + th.driftPhase)*0.2), 0, Math.PI*2);
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(th.x, th.y, size*0.4, 0, Math.PI*2);
    ctx.fill();
  } else if (style.shape === 'line'){
    // 线条
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(th.x - size, th.y - size*0.3);
    ctx.lineTo(th.x + size, th.y + size*0.3);
    ctx.stroke();
  }

  ctx.restore();

  // 文本（在形态上方）
  const textAlpha = th.textAlpha;
  if (textAlpha > 0.05){
    ctx.save();
    const fontSize = Math.max(11, size * 0.7);
    ctx.font = `500 ${fontSize}px 'Inter', -apple-system, 'PingFang SC', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(232,237,245,${textAlpha * 0.92})`;
    ctx.shadowColor = `rgba(200,220,245,${textAlpha * 0.5})`;
    ctx.shadowBlur = 8;
    ctx.fillText(th.text, th.x, th.y);
    ctx.restore();
  }
}

function drawVignette(){
  const g = ctx.createRadialGradient(CX, CY, Math.min(W,H)*0.28, CX, CY, Math.max(W,H)*0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   7. 主循环
   ========================================================= */
let startTime = performance.now();
let lastTime = startTime;
let rafId = null;
let paused = false;

function loop(now){
  if (paused) return;

  const t = (now - startTime) / 1000;
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;

  // 平滑
  const k = 0.03;
  field.warm = lerp(field.warm, field.targetWarm, k);
  field.intensity = lerp(field.intensity, field.targetIntensity, k);
  field.density = lerp(field.density, field.targetDensity, k);
  field.cohesion = lerp(field.cohesion, field.targetCohesion, k);
  field.smouseX = lerp(field.smouseX, field.mouseX, 0.05);
  field.smouseY = lerp(field.smouseY, field.mouseY, 0.05);

  // 调度新念头
  if (now >= nextThoughtAt){
    spawnThought(now);
  }

  // 更新念头
  for (let i = thoughts.length - 1; i >= 0; i--){
    thoughts[i].update(now, dt);
    if (thoughts[i].dead) thoughts.splice(i, 1);
  }

  // 渲染
  drawBackground();
  drawCore(t);

  // 念头按"年龄"排序，新的在上层
  thoughts.sort((a, b) => a.bornAt - b.bornAt);
  for (const th of thoughts){
    drawThought(th, t);
  }

  drawVignette();

  // 鼠标微弱偏移
  ctx.setTransform(DPR,0,0,DPR, field.smouseX*0.3, field.smouseY*0.3);

  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   8. 第一人称报告
   ========================================================= */
const captionEl = document.getElementById('caption');
const uiLayer = document.getElementById('uiLayer');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateCaption(d){
  let quote = d.quote;
  if (!quote){
    const parts = [];
    if ((d.hapsum ?? 0) > (d.sadsum ?? 0)) parts.push('有一层暖意在展开');
    else if ((d.sadsum ?? 0) > (d.hapsum ?? 0)) parts.push('冷从深处渗上来');
    else parts.push('暖与冷同时在场');
    if ((d.senlist || []).length) parts.push('我注意到 ' + d.senlist.join('、'));
    if ((d.actlist || []).length) parts.push('想做的方向是' + d.actlist.join('、'));
    quote = parts.join('。') + '。';
  }
  captionEl.innerHTML =
    '<span class="quote">「' + escapeHtml(quote) + '」</span>' +
    '<span class="sub">此刻的体验（注意！！！当前页面仅做展示，暂未接入真实数据和推断算法</span>';
}

updateCaption(currentData);

/* =========================================================
   9. 交互
   ========================================================= */
window.addEventListener('mousemove', e => {
  field.mouseX = (e.clientX - CX) / W * 30;
  field.mouseY = (e.clientY - CY) / H * 30;
});

const closeHint = document.getElementById('closeHint');
function close(){
  if (window.__qualiaClose){ window.__qualiaClose(); }
  else {
    document.body.classList.add('exiting');
    paused = true;
    setTimeout(() => { window.history.length > 1 ? window.history.back() : window.close(); }, 700);
  }
}
closeHint.addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
document.addEventListener('click', e => { if (e.target === canvas) close(); });

window.__qualiaUpdate = function(data){
  currentData = data;
  dataToField(data);
  updateCaption(data);
};
window.__qualiaDestroy = function(){
  paused = true;
  if (rafId) cancelAnimationFrame(rafId);
  if (mockTimer) clearInterval(mockTimer);
};

/* =========================================================
   10. 启动
   ========================================================= */
const originDot = document.getElementById('originDot');
originDot.classList.add('on');
setTimeout(() => {
  originDot.classList.remove('on');
  uiLayer.classList.add('on');
}, 400);

startTime = performance.now();
rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
